<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>設計元件對照｜服務問卷設計稿</title><script src="https://cdn.tailwindcss.com"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/design.css"><script defer src="assets/demo.js"></script></head><body><a class="skip" href="#main">跳至主要內容</a><main id="main" class="catalog"><header class="catalog-header"><p class="eyebrow">設計系統</p><h1>清楚、穩定，也保有溫度。</h1><p class="muted">色彩、元件與各種結果狀態的對照，皆以 16px 以上呈現。</p><a class="link" href="../index.html">返回設計總覽 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a></header><div class="stack"><section class="card"><h2>品牌色與文字</h2><div class="swatches" style="margin-top:20px"><div class="swatch"><div class="swatch-color" style="background:#234F46"></div><p class="swatch-label">品牌墨綠<br><span class="mono">#234F46</span></p></div><div class="swatch"><div class="swatch-color" style="background:#F5F3ED"></div><p class="swatch-label">暖白紙張<br><span class="mono">#F5F3ED</span></p></div><div class="swatch"><div class="swatch-color" style="background:#805219"></div><p class="swatch-label">期限琥珀<br><span class="mono">#805219</span></p></div><div class="swatch"><div class="swatch-color" style="background:#9A352E"></div><p class="swatch-label">錯誤紅<br><span class="mono">#9A352E</span></p></div></div></section><section class="card stack-sm"><h2>按鈕與選項</h2><div class="row wrap"><button class="btn btn-primary">主要行動</button><button class="btn btn-secondary">次要行動</button><button class="btn btn-danger">耗損處理</button><button class="btn btn-primary" disabled>處理中，請稍候</button></div><label class="choice"><input type="radio" name="component" checked><span>已選取的單選項目</span></label><label class="choice"><input type="radio" name="component"><span>未選取的單選項目</span></label><label class="field" for="componentField"><span>輸入框標籤</span><input id="componentField" class="input" type="text" value=""><span class=hint>欄位說明使用至少 16px。</span></label></section><section class="card"><h2>兌換券狀態</h2><div class="row wrap" style="margin-top:20px"><span class="badge "><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>未兌換</span><span class="badge gray"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>已兌換</span><span class="badge red"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg>已逾期</span><span class="badge gray"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>已作廢</span></div></section><section class="stack-sm"><div class="notice success" role="status"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div>問卷已送出，謝謝您的回饋。</div></div><div class="notice warning" role="status"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg><div>請於 24 小時內至服務台兌換，逾時自動取消</div></div><div class="notice error" role="alert"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 10 18H2L12 3Zm0 6v5m0 3v1"/></svg><div>目前無法連線，請確認網路後再試。</div></div><div class="notice " role="status"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11v6m0-10v1M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0"/></svg><div>仍在處理中，請稍候，不必重複送出。</div></div></section><section class="card"><h2>空白清單</h2><p class="muted" style="margin:16px 0">您目前沒有未兌換的券，歡迎填寫進行中的問卷。</p><a class="btn btn-primary" href="index.html">查看問卷</a></section></div></main></body></html>
