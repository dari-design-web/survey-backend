<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兌換券</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js?v=3.4.9"></script>
<script src="js/common.js?v=3.4.9"></script>
<script src="js/api.js?v=3.4.9"></script>
</head>
<body>
<div class="customer-shell">
  <script>document.write(brandHeader())</script>
  <main id="main" class="customer-main">
    <a class="link" href="my-coupons.html"><script>document.write(icon('back', 18))</script>我的兌換券</a>
    <div id="root" style="margin-top:16px"><p class="muted">載入中…</p></div>
  </main>
  <script>document.write(bottomNav('coupons'))</script>
</div>
<script>
const code = new URLSearchParams(location.search).get('code');
const root = document.getElementById('root');
(async () => {
  if (!code) { root.innerHTML = notice('error', 'alert', '缺少兌換券編號。', 'alert'); return; }
  try {
    const { coupon, survey } = await API.get('/api/public/coupons/' + encodeURIComponent(code));
    root.innerHTML = ticketHTML(coupon, survey) + termsHTML();
    loadGiftImages(root);
  } catch (e) {
    const notFound = e.status === 404 || /not_found/.test(e.message);
    root.innerHTML = `<div class="result-state error"><div class="state-symbol">${icon('alert', 32)}</div><h1>${notFound ? '查無此兌換券' : '暫時無法讀取兌換券'}</h1>
      <p class="muted" style="margin-top:12px">${notFound ? '請確認券號是否正確。' : '請確認網路連線後重新整理。'}</p></div>`;
  }
})();
</script>
</body>
</html>
