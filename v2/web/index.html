<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>服務滿意度調查</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js?v=3.4.4"></script>
<script src="js/common.js?v=3.4.4"></script>
<script src="js/api.js?v=3.4.4"></script>
</head>
<body>
<a class="skip" href="#main">跳至主要內容</a>
<div class="customer-shell">
  <script>document.write(brandHeader())</script>
  <main id="main" class="customer-main">
    <header>
      <p class="eyebrow">服務體驗回饋</p>
      <h1 class="serif" style="margin-top:12px">您的感受，<br>是我們進步的起點。</h1>
      <p class="muted" style="margin-top:16px">留下一點想法，讓下一次到訪更好。<span id="authNote">問卷採匿名填寫。</span></p>
    </header>
    <div class="hero-art">
      <div><span class="hero-count" id="count">—</span><p class="muted">份進行中的問卷</p></div>
      <svg class="archive-art" viewBox="0 0 180 150" fill="none" aria-hidden="true"><path d="M8 138h164M20 138V41h34v97M63 138V28h35v110M107 138V16h43v122M28 58h18m-18 8h18m-18 8h18M72 47h17m-17 8h17m-17 8h17m27-27h25m-25 8h25m-25 8h25M29 117h15M73 117h16m27 0h25" stroke="currentColor" stroke-width="2"/></svg>
    </div>
    <div id="list" class="stack"><p class="muted">載入中…</p></div>
    <div style="margin-top:24px"><script>document.write(notice('warning', 'clock', REDEEM_RULE))</script></div>
  </main>
  <script>document.write(bottomNav('survey'))</script>
</div>

<script>
(async () => {
  const list = document.getElementById('list');
  try {
    const { surveys } = await API.get('/api/public/surveys');
    document.getElementById('count').textContent = String(surveys.length).padStart(2, '0');
    if (!surveys.length) {
      list.innerHTML = notice('', 'info', '目前沒有進行中的問卷，歡迎稍後再回來。');
      return;
    }
    list.innerHTML = surveys.map(s => `
      <article class="card featured survey-card">
        <div class="between"><span class="badge">${icon('check', 16)}開放填寫</span>
          ${s.location_name ? `<span class="muted">${escHtml(s.location_name)}</span>` : ''}</div>
        <h2>${escHtml(s.title)}</h2>
        ${s.description ? `<p class="muted" style="display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden">${escHtml(s.description)}</p>` : ''}
        ${s.generate_coupon ? `<div class="gift-strip">${s.gift_image ? giftImgTag(s.gift_id, s.gift_image, 72) : icon('gift', 28)}<div><strong>完成後可領取紀念贈品</strong>
          <p>${s.gift_name ? escHtml(s.gift_name) + ' · ' : ''}每個帳號每月限領一次，數量有限</p></div></div>` : '<div style="height:20px"></div>'}
        <a class="btn btn-primary primary-action full" href="survey.html?id=${s.id}">開始填寫 ${icon('arrow')}</a>
      </article>`).join('');
    loadGiftImages(list);
  } catch (e) {
    list.innerHTML = notice('error', 'alert', '暫時無法連線，請稍後再試一次。<br><span class="muted">' + escHtml(e.message) + '</span>', 'alert');
  }
})();
</script>
<script>
publicConfig().then(c => { if (c && c.login_required) document.getElementById('authNote').textContent = '填寫前需以 Google 帳號授權確認身分（系統不保存您的姓名與 Email）。'; }).catch(() => {});
</script>
</body>
</html>
