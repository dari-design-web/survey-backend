<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送出完成</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js?v=3.4.1"></script>
<script src="js/common.js?v=3.4.1"></script>
<script src="js/api.js?v=3.4.1"></script>
</head>
<body>
<div class="customer-shell">
  <script>document.write(brandHeader())</script>
  <main id="main" class="customer-main"><div id="root"><p class="muted">載入中…</p></div></main>
  <script>document.write(bottomNav(''))</script>
</div>
<script>
const q = new URLSearchParams(location.search);
const code = q.get('code');
const reason = q.get('reason');
const nextDate = q.get('nextDate');
const naUrl = q.get('naUrl') || '';
const naLabel = q.get('naLabel') || '';
const naHint = q.get('naHint') || '';
const root = document.getElementById('root');

// 產生「下一步引導」按鈕 HTML（如果有設定的話）
function nextActionHTML(surveyObj) {
  const url = naUrl || surveyObj?.next_action_url || '';
  const label = naLabel || surveyObj?.next_action_label || '';
  const hint = naHint || surveyObj?.next_action_hint || '';
  if (!url || !label || !/^https?:\/\//i.test(url)) return '';
  return `<div class="card" style="margin-top:24px;text-align:center">
      ${hint ? `<p class="muted" style="margin-bottom:16px">${esc(hint)}</p>` : ''}
      <a href="${esc(url)}" target="_blank" rel="noopener" class="btn btn-secondary full">${esc(label)} ${icon('arrow')}</a></div>`;
}

function doneHeader(title, sub, kind) {
  return `<div class="result-state ${kind || ''}" style="margin-top:8px">
    <div class="state-symbol">${icon(kind === 'error' ? 'alert' : 'check', 32)}</div>
    <h1 class="serif">${esc(title)}</h1>
    ${sub ? `<p class="muted pre" style="margin-top:12px">${esc(sub)}</p>` : ''}</div>`;
}
const links = `<div class="stack-sm" style="margin-top:24px">
  <a class="btn btn-secondary full" href="my-coupons.html">${icon('ticket')}查看我的兌換券</a>
  <a class="btn btn-plain full" href="index.html">返回問卷列表</a></div>`;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}

const DEFAULT_THANKS = '感謝您完成本次滿意度調查！\n您的意見將作為我們持續改善服務品質、環境設施與整體體驗的重要參考。\n請於 24 小時內出示下方兌換券 QR Code 至指定地點兌換贈品，逾時將自動取消。';

// 先檢查 sessionStorage 有沒有剛送出時 survey.html 暫存的 coupon
function readCache(code) {
  try {
    const raw = sessionStorage.getItem('coupon_cache_' + code);
    if (!raw) return null;
    const data = JSON.parse(raw);
    // 30 秒內的快取才算數（避免顯示過期狀態）
    if (Date.now() - (data.t || 0) > 30000) return null;
    return data;
  } catch(_) { return null; }
}

(async () => {
  if (code) {
    // 先試 sessionStorage 快取（剛送出時的即時資料）
    const cached = readCache(code);
    if (cached && cached.coupon) {
      renderCoupon(cached.coupon, cached.survey);
      // 立即顯示後，背景靜默更新一次（不阻塞畫面）
      API.get('/api/public/coupons/' + encodeURIComponent(code))
        .then(r => renderCoupon(r.coupon, r.survey))
        .catch(() => {});
      return;
    }
    try {
      const { coupon, survey } = await API.get('/api/public/coupons/' + encodeURIComponent(code));
      renderCoupon(coupon, survey);
    } catch (e) {
      root.innerHTML = notice('error', 'alert', '無法載入兌換券：' + esc(e.message), 'alert') + links;
    }
  } else if (reason === 'out_of_stock') {
    root.innerHTML = doneHeader('問卷已送出', '感謝您的回饋，您的意見已完整送出。') +
      '<div style="margin-top:24px">' + notice('warning', 'gift', '本期贈品已兌換完畢，本次未產生兌換券。') + '</div>' + nextActionHTML() + links;
  } else if (reason === 'interval_not_met' || reason === 'monthly_limit') {
    root.innerHTML = doneHeader('問卷已送出', '感謝您的回饋，您的意見已完整送出。') +
      '<div style="margin-top:24px">' + notice('warning', 'clock', '每個帳號每月限領一次贈品，您本月已兌換過，本次不再發券。' +
      (nextDate ? `<br><strong>${esc(nextDate)}</strong> 起可再領取。` : '')) + '</div>' + nextActionHTML() + links;
  } else {
    root.innerHTML = doneHeader('問卷已送出', '感謝您完成本次滿意度調查！您的意見將作為我們持續改善的重要參考。') + nextActionHTML() + links;
  }
})();

function renderCoupon(coupon, survey) {
  const thanks = survey?.thank_you_message || DEFAULT_THANKS;
  root.innerHTML = doneHeader('感謝您的回饋！', thanks) +
    '<div style="margin-top:24px">' + ticketHTML(coupon, survey) + '</div>' + termsHTML() + nextActionHTML(survey) + links;
  loadGiftImages(root);
}
</script>
</body>
</html>
