<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>兌換券核銷</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../config.js?v=3.4.8"></script>
<script src="../js/common.js?v=3.4.8"></script>
<script src="../js/api.js?v=3.4.8"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<script>renderAdminHeader('redeem');</script>
<main class="admin-main" style="max-width:560px">
  <header><p class="eyebrow">現場核銷</p><h1 style="margin-top:8px">掃描兌換券</h1>
    <p class="muted" style="margin-top:8px">掃描客人手機上的 QR Code，或手動輸入券號。看到「核銷成功」才交付贈品。</p>
    <a class="link" href="guide.html" target="_blank" rel="noopener">櫃台核銷操作單（可列印）</a></header>
  <div class="card stack-sm">
    <button id="scanBtn" type="button" class="btn btn-primary primary-action full"></button>
    <video id="video" class="hidden" playsinline style="width:100%;border-radius:16px;background:var(--ink)"></video>
    <div class="rule" style="margin:16px 0"></div>
    <label class="field" for="code"><span>或輸入券號</span>
      <div class="row"><input id="code" type="text" placeholder="例：NA-20261102-0001-AB12" autocomplete="off" autocapitalize="characters" class="input mono grow">
      <button id="lookupBtn" type="button" class="btn btn-secondary">查詢</button></div></label>
  </div>
  <div id="result" class="staff-result" aria-live="polite"></div>
</main>
<script>
const code = document.getElementById('code');
const SCAN_LABEL = icon('scan', 22) + '開啟相機掃描';
document.getElementById('scanBtn').innerHTML = SCAN_LABEL;
const result = document.getElementById('result');
const video = document.getElementById('video');
let stream = null, scanning = false;

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}

// 自動帶入 URL 內的 ?code=
const initCode = new URLSearchParams(location.search).get('code');
if (initCode) { code.value = initCode; lookup(initCode); }

async function lookup(c) {
  result.innerHTML = '<p class="muted">查詢中…</p>';
  try {
    const d = await API.get('/api/redeem/lookup?code=' + encodeURIComponent(c));
    render(d, c);
  } catch (e) { result.innerHTML = notice('error', 'alert', esc(e.message), 'alert'); }
}

function stateBlock(kind, iconName, title, sub) {
  return `<div class="result-state ${kind}"><div class="state-symbol">${icon(iconName, 32)}</div>
    <p class="big-state">${esc(title)}</p>${sub ? `<p class="muted">${sub}</p>` : ''}</div>`;
}

function render(d, c) {
  if (!d.ok) { result.innerHTML = `<div class="card">${stateBlock('error', 'x', '查無此券', esc(d.message))}</div>`; return; }
  const co = d.coupon;
  const sm = { issued: ['', 'check', '可兌換', true], redeemed: ['gray', 'check', '已使用', false],
               expired: ['error', 'clock', '已逾期', false], voided: ['gray', 'x', '已作廢', false] };
  const [kind, ic, lab, canRedeem] = sm[co.status] || ['error', 'x', co.status, false];
  result.innerHTML = `<div class="card">
    ${stateBlock(kind, ic, lab, canRedeem ? '請確認贈品後按「確認核銷」' : (co.status === 'redeemed' ? '此券已於 ' + esc(fmtTpe(co.redeemed_at, 'short')) + ' 使用' : '此券不能兌換'))}
    <dl class="meta-list">
      <div><dt>券號</dt><dd class="mono">${esc(co.code)}</dd></div>
      ${co.gift_name ? `<div><dt>贈品</dt><dd><strong>${esc(co.gift_name)} × 1</strong></dd></div>` : ''}
      ${co.gift_id ? `<div style="justify-content:center">${giftImgTag(co.gift_id, 'lookup', 120)}</div>` : ''}
      <div><dt>問卷</dt><dd>${esc(co.survey_title || '—')}</dd></div>
      <div><dt>取得時間</dt><dd>${esc(fmtTpe(co.issued_at, 'short'))}</dd></div>
      <div><dt>兌換期限</dt><dd>${esc(fmtTpe(co.expires_at, 'short'))}</dd></div>
    </dl>
    ${canRedeem ? `<button id="confirmBtn" type="button" class="btn btn-primary primary-action full">確認核銷</button>` : ''}
    <button type="button" class="btn btn-plain full" style="margin-top:12px" onclick="resetScan()">掃描下一張</button>
  </div>`;
  loadGiftImages(result);
  const btn = document.getElementById('confirmBtn');
  if (btn) btn.onclick = () => doRedeem(c);
}

function resetScan() { result.innerHTML = ''; code.value = ''; code.focus(); }

async function doRedeem(c) {
  const btn = document.getElementById('confirmBtn');
  btn.disabled = true; btn.textContent = '核銷中…';
  try {
    const r = await API.post('/api/redeem', { code: c });
    if (r.ok) {
      result.innerHTML = `<div class="card">${stateBlock('', 'check', '核銷成功', '請交付贈品' + (r.coupon.gift_name ? '：<strong>' + esc(r.coupon.gift_name) + '</strong>' : ''))}
        <dl class="meta-list"><div><dt>券號</dt><dd class="mono">${esc(r.coupon.coupon_code)}</dd></div>
        <div><dt>核銷時間</dt><dd>${esc(fmtTpe(r.coupon.redeemed_at, 'short'))}</dd></div></dl>
        <button type="button" class="btn btn-primary primary-action full" onclick="resetScan()">掃描下一張</button></div>`;
    } else {
      result.innerHTML = `<div class="card">${stateBlock('error', 'x', '無法核銷', esc(r.message))}
        <button type="button" class="btn btn-plain full" onclick="resetScan()">掃描下一張</button></div>`;
    }
  } catch (e) { result.insertAdjacentHTML('afterbegin', notice('error', 'alert', '核銷失敗：' + esc(e.message), 'alert')); btn.disabled = false; btn.textContent = '確認核銷'; }
}

document.getElementById('lookupBtn').addEventListener('click', () => { const c = code.value.trim(); if (c) lookup(c); });
code.addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('lookupBtn').click(); });

document.getElementById('scanBtn').addEventListener('click', async () => {
  if (scanning) { stopScan(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream; video.classList.remove('hidden'); await video.play();
    scanning = true; document.getElementById('scanBtn').innerHTML = '停止掃描';
    loopScan();
  } catch (e) { alert('無法開啟相機：' + e.message); }
});

function stopScan() {
  scanning = false;
  if (stream) stream.getTracks().forEach(t => t.stop());
  video.classList.add('hidden');
  document.getElementById('scanBtn').innerHTML = SCAN_LABEL;
}

function loopScan() {
  if (!scanning) return;
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth; canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const qr = jsQR(img.data, img.width, img.height);
  if (qr && qr.data) {
    // QR 內容可能是 GIFT-... 或完整 URL；嘗試取出 code
    let c = qr.data.trim();
    const m = c.match(/code=([A-Z0-9-]+)/i);
    if (m) c = m[1];
    code.value = c; stopScan(); lookup(c); return;
  }
  requestAnimationFrame(loopScan);
}
</script>
</body>
</html>
