<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>贈品庫存</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../config.js?v=3.4.9"></script>
<script src="../js/common.js?v=3.4.9"></script>
<script src="../js/api.js?v=3.4.9"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<script>renderAdminHeader('gifts');</script>
<main class="admin-main">
  <header class="between">
    <div><p class="eyebrow">贈品庫存</p><h1 style="margin-top:8px">贈品與庫存</h1></div>
    <button type="button" onclick="toggleNew()" class="btn btn-primary">＋ 新增贈品</button>
  </header>
  <div style="margin-bottom:24px"><script>document.write(notice('', 'info', '<strong>實際庫存</strong>＝現場應有數量；<strong>已預留</strong>＝已發出、未兌換且未逾期的券；<strong>可發</strong>＝實際庫存 − 已預留。客人完成問卷時先預扣 1 份；券逾期（24 小時）或作廢會自動回到可發。'))</script></div>

  <div id="newBox" class="hidden card" style="margin-bottom:24px">
    <h2>新增贈品</h2>
    <div class="form-grid" style="margin-top:20px">
      <label class="field" for="n_name"><span>贈品名稱（必填）</span><input id="n_name" class="input" placeholder="例：檔案館帆布袋"></label>
      <label class="field" for="n_qty"><span>期初數量</span><input id="n_qty" type="number" min="0" value="0" class="input"></label>
      <label class="field" for="n_alert"><span>低庫存提醒</span><input id="n_alert" type="number" min="0" value="10" class="input"><span class="hint">可發數量低於或等於此數字時標示提醒</span></label>
      <label class="field" for="n_desc"><span>說明（選填）</span><input id="n_desc" class="input"></label>
    </div>
    <div class="row" style="margin-top:24px">
      <button type="button" onclick="createGift()" class="btn btn-primary">建立</button>
      <button type="button" onclick="toggleNew()" class="btn btn-plain">取消</button>
    </div>
    <p class="hint">建立後，到「問卷設計 → 編輯問卷」選擇這個贈品，新發的券就會使用它。</p>
  </div>

  <div id="list" class="stack"><p class="muted">載入中…</p></div>
</main>

<div id="modal" class="hidden modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="m_title">
  <div class="modal-panel">
    <h2 id="m_title"></h2>
    <p id="m_hint" class="muted" style="margin-top:8px"></p>
    <label class="field" for="m_qty"><span id="m_qtyLabel">數量</span><input id="m_qty" type="number" min="0" class="input" style="font-size:20px"></label>
    <label class="field" for="m_note"><span id="m_noteLabel">備註</span><input id="m_note" class="input"></label>
    <div id="m_err" role="alert" style="color:var(--red);margin-top:12px"></div>
    <div class="between">
      <button type="button" onclick="closeModal()" class="btn btn-plain">取消</button>
      <button type="button" id="m_ok" class="btn btn-primary">確認</button>
    </div>
  </div>
</div>

<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}
let gifts = [];

function toggleNew() { document.getElementById('newBox').classList.toggle('hidden'); }

async function load() {
  try {
    gifts = (await API.get('/api/admin/gifts')).gifts;
    render();
  } catch (e) {
    document.getElementById('list').innerHTML = notice('error', 'alert', '載入失敗：' + esc(e.message), 'alert');
  }
}

function render() {
  const box = document.getElementById('list');
  if (!gifts.length) {
    box.innerHTML = notice('', 'gift', '尚未建立贈品，請先按「＋ 新增贈品」。');
    return;
  }
  box.innerHTML = gifts.map(g => {
    const low = g.is_active && g.low_stock;
    return `<article class="card ${g.is_active ? '' : 'inactive'}" style="${g.is_active ? '' : 'opacity:.7'}">
      <div class="between">
        <div><h2>${esc(g.name)}</h2>
          <div class="row wrap" style="margin-top:8px">${g.is_active ? '<span class="badge">啟用中</span>' : '<span class="badge gray">已停用</span>'}
          ${low ? '<span class="badge amber">庫存偏低</span>' : ''}</div></div>
        <div class="row"><button type="button" onclick="editGift(${g.id})" class="btn btn-plain">改名稱</button>
          <button type="button" onclick="toggleActive(${g.id})" class="btn btn-plain">${g.is_active ? '停用' : '啟用'}</button></div>
      </div>
      ${g.description ? `<p class="muted" style="margin-top:8px">${esc(g.description)}</p>` : ''}
      <div class="row wrap" style="margin-top:16px;align-items:center">
        ${g.image_version ? giftImgTag(g.id, g.image_version, 96) : `<div style="width:96px;height:96px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted)">${icon('gift', 32)}</div>`}
        <div class="stack-sm">
          <label class="btn btn-secondary" style="cursor:pointer">${g.image_version ? '更換圖片' : '上傳圖片'}
            <input type="file" accept="image/*" class="sr-only" onchange="uploadImage(${g.id}, this)"></label>
          ${g.image_version ? `<button type="button" class="btn btn-plain" onclick="removeImage(${g.id})">移除圖片</button>` : ''}
          <span class="hint" id="imgMsg_${g.id}">任何尺寸的照片都可以：系統會自動裁成正方形 480×480 並壓縮到約 80KB 以下。</span>
        </div>
      </div>
      <p class="muted" style="margin-top:8px">使用中的問卷：${g.surveys.length ? g.surveys.map(s => esc(s.title) + (s.is_active ? '' : '（停用）')).join('、') : '無'}</p>
      <div class="stock-grid">
        <div class="stock-stat">實際庫存<strong>${g.on_hand}</strong></div>
        <div class="stock-stat reserved">已預留<strong>${g.reserved}</strong></div>
        <div class="stock-stat ${low ? 'low' : 'available'}">可發<strong>${g.available}</strong></div>
      </div>
      <div class="row wrap">
        <button type="button" onclick="openStock(${g.id},'receive')" class="btn btn-primary">＋ 入庫</button>
        <button type="button" onclick="openStock(${g.id},'loss')" class="btn btn-danger">－ 耗損</button>
        <button type="button" onclick="openStock(${g.id},'count')" class="btn btn-secondary">盤點調整</button>
        <button type="button" onclick="showLogs(${g.id})" class="btn btn-plain" style="margin-left:auto">異動紀錄</button>
      </div>
      <div id="logs_${g.id}" class="hidden table-scroll" style="margin-top:20px"></div>
    </article>`;
  }).join('');
  loadGiftImages(box);
}

// 圖片：裁成置中正方形 → 縮成 480×480 JPEG → 品質由 0.85 往下調到 ≤ 約 80KB
function resizeSquare(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
      let out = null;
      for (const size of [480, 400, 320]) {
        const cv = document.createElement('canvas');
        cv.width = cv.height = size;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, size, size);
        cx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        for (let q = 0.85; q >= 0.45; q -= 0.1) {
          out = cv.toDataURL('image/jpeg', q);
          if (out.length <= 110000) { URL.revokeObjectURL(url); return resolve(out); }
        }
      }
      URL.revokeObjectURL(url);
      out && out.length <= 118000 ? resolve(out) : reject(new Error('圖片無法壓縮到上限內，請換一張'));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('無法讀取這個圖片檔')); };
    img.src = url;
  });
}

async function uploadImage(id, input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const msg = document.getElementById('imgMsg_' + id);
  if (file.size > 20 * 1024 * 1024) { msg.textContent = '原始檔超過 20MB，請換一張'; return; }
  msg.textContent = '處理中…';
  try {
    const dataUrl = await resizeSquare(file);
    await API.post('/api/admin/gifts/' + id + '/image', { data_url: dataUrl });
    load();
  } catch (e) { msg.textContent = '上傳失敗：' + e.message; }
}

async function removeImage(id) {
  if (!confirm('確定移除這個贈品的圖片？')) return;
  try { await API.del('/api/admin/gifts/' + id + '/image'); load(); } catch (e) { alert('移除失敗：' + e.message); }
}

async function createGift() {
  const body = { name: n_name.value.trim(), initial_qty: +n_qty.value || 0, low_stock_alert: +n_alert.value || 0, description: n_desc.value.trim() };
  if (!body.name) return alert('請填寫贈品名稱');
  try {
    await API.post('/api/admin/gifts', body);
    n_name.value = ''; n_qty.value = 0; n_desc.value = '';
    toggleNew(); load();
  } catch (e) { alert('建立失敗：' + e.message); }
}

async function editGift(id) {
  const g = gifts.find(x => x.id === id);
  const name = prompt('贈品名稱', g.name);
  if (name === null) return;
  const alertN = prompt('低庫存提醒數量', g.low_stock_alert ?? 10);
  if (alertN === null) return;
  try { await API.put('/api/admin/gifts/' + id, { name, low_stock_alert: +alertN || 0 }); load(); }
  catch (e) { alert('儲存失敗：' + e.message); }
}

async function toggleActive(id) {
  const g = gifts.find(x => x.id === id);
  if (g.is_active && g.surveys.some(s => s.is_active) && !confirm('有啟用中的問卷使用此贈品，停用後這些問卷將不再發券。確定停用？')) return;
  try { await API.put('/api/admin/gifts/' + id, { is_active: !g.is_active }); load(); }
  catch (e) { alert('操作失敗：' + e.message); }
}

const ACTIONS = {
  receive: { title: '入庫', hint: '新到貨或補貨，數量會加到實際庫存。', qty: '入庫數量', note: '備註（選填，例如進貨單號）' },
  loss: { title: '耗損', hint: '破損、遺失、贈送他用等，數量會從實際庫存扣除。', qty: '耗損數量', note: '原因（必填）' },
  count: { title: '盤點調整', hint: '輸入現場實際點到的數量，系統會自動計算差額並記錄。', qty: '實際點到的數量', note: '說明（必填，例如月底盤點）' }
};
let modalCtx = null;

function openStock(id, action) {
  const g = gifts.find(x => x.id === id), a = ACTIONS[action];
  modalCtx = { id, action };
  m_title.textContent = a.title + '｜' + g.name;
  m_hint.textContent = a.hint + (action !== 'receive' ? `（目前實際 ${g.on_hand}、已預留 ${g.reserved}，實際庫存不可少於已預留）` : '');
  m_qtyLabel.textContent = a.qty; m_noteLabel.textContent = a.note;
  m_qty.value = action === 'count' ? g.on_hand : ''; m_note.value = ''; m_err.textContent = '';
  document.getElementById('modal').classList.remove('hidden');
  setTimeout(() => m_qty.focus(), 50);
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); modalCtx = null; }

document.getElementById('m_ok').addEventListener('click', async () => {
  if (!modalCtx) return;
  const btn = document.getElementById('m_ok');
  btn.disabled = true; m_err.textContent = '';
  try {
    await API.post('/api/admin/gifts/' + modalCtx.id + '/stock', { action: modalCtx.action, qty: +m_qty.value, note: m_note.value.trim() });
    closeModal(); load();
  } catch (e) { m_err.textContent = e.message; }
  finally { btn.disabled = false; }
});

async function showLogs(id) {
  const box = document.getElementById('logs_' + id);
  if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.innerHTML = '<p class="muted">載入中…</p>';
  try {
    const { logs } = await API.get('/api/admin/gifts/' + id + '/logs');
    box.innerHTML = logs.length ? `<table><thead><tr><th>時間</th><th>類型</th><th>異動</th><th>異動後</th><th>人員</th><th>備註</th></tr></thead>
      <tbody>${logs.map(l => `<tr><td style="white-space:nowrap">${esc(fmtTpe(l.created_at, 'short'))}</td><td>${esc(l.action_label)}</td>
        <td class="mono" style="color:${l.on_hand_delta < 0 ? 'var(--red)' : 'var(--green)'}">${l.on_hand_delta > 0 ? '+' : ''}${l.on_hand_delta}</td>
        <td class="mono">${l.on_hand_after ?? ''}</td><td>${esc(l.admin_name || '系統')}</td><td>${esc(l.note)}</td></tr>`).join('')}</tbody></table>`
      : '<p class="muted">尚無紀錄</p>';
  } catch (e) { box.innerHTML = notice('error', 'alert', esc(e.message), 'alert'); }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('modal').classList.contains('hidden')) closeModal(); });
load();
</script>
</body>
</html>
