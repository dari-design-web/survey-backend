<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的兌換券</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js?v=3.4.6"></script>
<script src="js/common.js?v=3.4.6"></script>
<script src="js/api.js?v=3.4.6"></script>
</head>
<body>
<div class="customer-shell">
  <script>document.write(brandHeader())</script>
  <main id="main" class="customer-main">
    <header><p class="eyebrow">兌換券</p><h1 class="serif" style="margin-top:12px">我的兌換券</h1>
      <p class="muted" style="margin-top:12px">顯示您帳號（或此裝置）的紀錄。每個帳號每月限領一次贈品。超過 30 天的已兌換、已逾期紀錄不再顯示。</p></header>
    <div id="filterBar" class="filter-tabs hidden" role="group" aria-label="篩選兌換券" style="margin-top:20px">
      <button type="button" class="filter-tab" data-filter="all" onclick="filterTo('all')">全部</button>
      <button type="button" class="filter-tab" data-filter="issued" onclick="filterTo('issued')">未兌換</button>
      <button type="button" class="filter-tab" data-filter="redeemed" onclick="filterTo('redeemed')">已兌換</button>
      <button type="button" class="filter-tab" data-filter="expired" onclick="filterTo('expired')">已逾期／作廢</button>
    </div>
    <div id="root" class="stack" style="margin-top:16px"><p class="muted">載入中…</p></div>
    <div id="logoutBox" style="margin-top:16px"></div>
    <div style="margin-top:32px"><div id="idNote"></div><script>document.getElementById('idNote').innerHTML = notice('', 'info', '本系統採匿名方式，只以此裝置的識別碼對應您的兌換券；換手機或清除瀏覽器資料後將無法查看。');
publicConfig().then(c => { if (c && c.login_required) document.getElementById('idNote').innerHTML = notice('', 'info', '兌換券依您的 Google 帳號保存；換手機時，以同一個 Google 帳號授權即可查看。系統不保存您的姓名與 Email。'); }).catch(() => {});</script></div>
  </main>
  <script>document.write(bottomNav('coupons'))</script>
</div>
<script>
const DEVICE_KEY = 'survey_device_id';
function getDeviceId() { try { return localStorage.getItem(DEVICE_KEY) || ''; } catch (_) { return ''; } }
let _allCoupons = [], _currentFilter = 'all';

async function load() {
  const did = getDeviceId();
  const root = document.getElementById('root');
  try {
    const cfg = await publicConfig();
    if (cfg.login_required && !getCustomerToken()) { renderGoogleLogin(root, '授權後即可查看您的兌換券。'); return; }
    if (!cfg.login_required && !did) { root.innerHTML = renderEmpty('尚無兌換券', '完成問卷後，兌換券會顯示在這裡。'); return; }
    const r = await API.get('/api/public/my-coupons?deviceId=' + encodeURIComponent(did));
    if (r.need_login) { setCustomerToken(null); renderGoogleLogin(root, '授權已過期，請重新以 Google 帳號授權。'); return; }
    if (cfg.login_required) document.getElementById('logoutBox').innerHTML = `<button type="button" class="btn btn-plain" onclick="customerLogout()">取消此裝置的 Google 授權</button>`;
    _allCoupons = r.coupons || [];
    document.getElementById('filterBar').classList.toggle('hidden', !_allCoupons.length);
    if (!_allCoupons.length) root.innerHTML = renderEmpty('您目前沒有兌換券', '完成問卷後，兌換券會顯示在這裡。');
    else filterTo(_currentFilter);
  } catch (e) {
    root.innerHTML = notice('error', 'alert', '暫時無法載入：' + escHtml(e.message), 'alert');
  }
}

function filterTo(filter) {
  _currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.filter === filter ? 'true' : 'false'));
  const list = filter === 'all' ? _allCoupons : _allCoupons.filter(c =>
    filter === 'expired' ? (c.status === 'expired' || c.status === 'voided') : c.status === filter);
  document.getElementById('root').innerHTML = list.length ? list.map(renderCard).join('') : '<p class="muted">此分類沒有兌換券。</p>';
  loadGiftImages(document.getElementById('root'));
}

function renderCard(c) {
  const active = c.status === 'issued';
  return `<article class="card coupon-card ${active ? '' : 'inactive'}">
    <div class="between">${couponBadge(c.status)}<span class="muted">${escHtml(c.location_name || '')}</span></div>
    <h2>${escHtml(c.gift_name || c.coupon_title || '贈品兌換券')}</h2>
    <p class="mono">${escHtml(c.coupon_code)}</p>
    <dl class="meta-list">
      <div><dt>問卷</dt><dd>${escHtml(c.survey_title || '')}</dd></div>
      <div><dt>${c.status === 'redeemed' ? '兌換時間' : '兌換期限'}</dt><dd>${escHtml(fmtTpe(c.status === 'redeemed' ? c.redeemed_at : c.expires_at, 'short'))}</dd></div>
      ${c.redemption_location ? `<div><dt>兌換地點</dt><dd>${escHtml(c.redemption_location)}</dd></div>` : ''}
    </dl>
    <a class="btn ${active ? 'btn-primary' : 'btn-plain'} full" href="coupon.html?code=${encodeURIComponent(c.coupon_code)}">${active ? '出示兌換券' : '查看紀錄'} ${icon('arrow')}</a>
  </article>`;
}

function renderEmpty(title, sub) {
  return `<div class="card" style="text-align:center"><div class="state-symbol">${icon('ticket', 32)}</div>
    <h2>${escHtml(title)}</h2><p class="muted" style="margin:8px 0 20px">${escHtml(sub)}</p>
    <a class="btn btn-primary full" href="index.html">前往填寫問卷</a></div>`;
}
load();
</script>
</body>
</html>
