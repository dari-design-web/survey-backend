<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>編輯問卷</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<script>renderAdminHeader('surveys');</script>
<main class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
  <h1 id="title" class="text-2xl font-bold mb-5">新增問卷</h1>

  <div class="bg-white rounded-xl border p-5 mb-5">
    <h2 class="font-bold mb-3 text-slate-700">基本設定</h2>
    <div class="grid md:grid-cols-2 gap-4 text-sm">
      <label class="block"><span class="text-slate-700">問卷名稱 <span class="text-red-500">*</span></span>
        <input id="f_title" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block"><span class="text-slate-700">場域名稱</span>
        <input id="f_location" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block md:col-span-2"><span class="text-slate-700">問卷說明（會顯示在問卷頂部，可多行）</span>
        <textarea id="f_desc" rows="4" class="mt-1 w-full border rounded px-3 py-2"></textarea></label>
      <label class="block"><span class="text-slate-700">開始日期</span>
        <input id="f_start" type="date" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block"><span class="text-slate-700">結束日期</span>
        <input id="f_end" type="date" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="flex items-center gap-2"><input id="f_active" type="checkbox" checked class="rounded">啟用問卷</label>
      <label class="flex items-center gap-2"><input id="f_genCoupon" type="checkbox" checked class="rounded">完成後產生兌換券</label>
      <label class="block"><span class="text-slate-700">兌換券有效天數</span>
        <input id="f_validDays" type="number" min="1" value="30" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block"><span class="text-slate-700">兌換間隔（天）</span>
        <input id="f_interval" type="number" min="0" value="30" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block md:col-span-2"><span class="text-slate-700">兌換地點說明</span>
        <input id="f_redLoc" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block"><span class="text-slate-700">兌換券標題</span>
        <input id="f_ctitle" value="贈品兌換券" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block"><span class="text-slate-700">兌換券副標</span>
        <input id="f_csub" value="感謝您完成滿意度調查" class="mt-1 w-full border rounded px-3 py-2"></label>
      <label class="block md:col-span-2"><span class="text-slate-700">送出完成頁文字（可多行）</span>
        <textarea id="f_thank" rows="3" class="mt-1 w-full border rounded px-3 py-2"></textarea></label>
    </div>
    <div class="mt-4 flex gap-2">
      <button id="saveBtn" class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded font-bold text-sm">建立問卷</button>
      <a href="surveys.html" class="px-4 py-2 text-sm text-slate-600">取消</a>
    </div>
    <p id="msg" class="mt-2 text-sm"></p>
  </div>

  <div id="qsec" class="bg-white rounded-xl border p-5 hidden">
    <!-- 頂部按鈕：sticky 黏在頁面上緣 -->
    <div class="sticky top-0 -mx-5 -mt-5 px-5 py-3 mb-4 bg-white border-b border-slate-200 z-30 flex flex-wrap justify-between items-center gap-2">
      <h2 class="font-bold text-slate-700">題目清單</h2>
      <div class="flex gap-2 items-center">
        <button id="saveAllBtnTop" onclick="saveAll()" disabled
          class="bg-slate-200 text-slate-400 cursor-not-allowed px-4 py-1.5 rounded text-sm font-bold transition">
          全部已儲存 ✓
        </button>
        <button onclick="addQ('section')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded text-sm font-bold">+ 章節</button>
        <button onclick="addQ('single')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-sm font-bold">+ 新增題目</button>
      </div>
    </div>
    <p class="text-xs text-slate-500 mb-3 leading-relaxed">
      📌 提示：選項中包含「其他」二字者，前台會自動顯示一個文字輸入欄；<br>
      📌 評分題（1-5）前台會自動附加「未使用／不適用」選項；<br>
      📌 章節題（section）作為分段標題，不必填、不計入統計。
    </p>
    <div id="qList" class="space-y-3"></div>

    <!-- 底部按鈕：題目多時不用滑回上面 -->
    <div id="qBottomAdd" class="mt-4 hidden border-t border-dashed border-slate-300 pt-4 flex flex-wrap justify-center gap-2">
      <button id="saveAllBtnBottom" onclick="saveAll()" disabled
        class="bg-slate-200 text-slate-400 cursor-not-allowed px-4 py-2 rounded text-sm font-bold">
        全部已儲存 ✓
      </button>
      <button onclick="addQ('section')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-bold">+ 章節</button>
      <button onclick="addQ('single')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded text-sm font-bold">+ 新增題目</button>
    </div>
  </div>
</main>

<!-- 右下角浮動按鈕（FAB） -->
<div id="fab" class="fixed bottom-6 right-6 z-40 hidden flex-col gap-2 items-end">
  <button id="fabSave" onclick="saveAll()" disabled title="儲存全部變更"
    class="bg-slate-300 text-slate-500 cursor-not-allowed rounded-full shadow-lg w-12 h-12 text-lg flex items-center justify-center transition-transform hover:scale-105 active:scale-95">
    💾
  </button>
  <button onclick="addQ('section')" title="新增章節"
    class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full shadow-lg w-12 h-12 text-lg font-bold flex items-center justify-center transition-transform hover:scale-105 active:scale-95">
    §
  </button>
  <button onclick="addQ('single')" title="新增題目"
    class="bg-emerald-600 hover:bg-emerald-700 text-white rounded-full shadow-lg w-14 h-14 text-2xl font-bold flex items-center justify-center transition-transform hover:scale-105 active:scale-95">
    +
  </button>
</div>

<script>
let sid = Number(new URLSearchParams(location.search).get('id')) || null;
const msg = document.getElementById('msg');

const TYPE_OPTIONS = [
  ['section', '【章節標題】'],
  ['single',   '單選題'],
  ['multiple', '複選題'],
  ['rating',   '評分 1-5（含未使用）'],
  ['nps',      'NPS 0-10'],
  ['text',     '短文字'],
  ['textarea', '長文字'],
  ['phone',    '手機號碼'],
  ['select',   '下拉選單'],
];

const HAS_OPTIONS = new Set(['single','multiple','select','section']);

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}

function readForm() {
  return {
    title: f_title.value.trim(), location_name: f_location.value.trim(),
    description: f_desc.value, start_date: f_start.value || null, end_date: f_end.value || null,
    is_active: f_active.checked, generate_coupon: f_genCoupon.checked,
    coupon_valid_days: +f_validDays.value, redemption_interval_days: +f_interval.value,
    redemption_location: f_redLoc.value.trim(),
    coupon_title: f_ctitle.value.trim(), coupon_subtitle: f_csub.value.trim(),
    thank_you_message: f_thank.value
  };
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const body = readForm();
  if (!body.title) { msg.textContent = '請填寫問卷名稱'; msg.className = 'text-red-600 mt-2 text-sm'; return; }
  try {
    const r = sid ? await API.put('/api/admin/surveys/' + sid, body)
                  : await API.post('/api/admin/surveys', body);
    if (!sid && r.id) location.href = '?id=' + r.id;
    else { msg.textContent = '已儲存 ✓'; msg.className = 'text-green-600 mt-2 text-sm'; }
  } catch (e) { msg.textContent = '儲存失敗：' + e.message; msg.className = 'text-red-600 mt-2 text-sm'; }
});

async function load() {
  if (!sid) return;
  document.getElementById('title').textContent = '編輯問卷';
  document.getElementById('saveBtn').textContent = '儲存設定';
  const { survey, questions } = await API.get('/api/admin/surveys/' + sid);
  f_title.value = survey.title || '';
  f_location.value = survey.location_name || '';
  f_desc.value = survey.description || '';
  f_start.value = survey.start_date || '';
  f_end.value = survey.end_date || '';
  f_active.checked = !!survey.is_active;
  f_genCoupon.checked = !!survey.generate_coupon;
  f_validDays.value = survey.coupon_valid_days || 30;
  f_interval.value = survey.redemption_interval_days ?? 30;
  f_redLoc.value = survey.redemption_location || '';
  f_ctitle.value = survey.coupon_title || '贈品兌換券';
  f_csub.value = survey.coupon_subtitle || '感謝您完成滿意度調查';
  f_thank.value = survey.thank_you_message || '';
  document.getElementById('qsec').classList.remove('hidden');
  // 進入編輯後顯示浮動按鈕
  const fab = document.getElementById('fab');
  if (fab) { fab.classList.remove('hidden'); fab.classList.add('flex'); }
  _questions = questions || [];
  renderQs(_questions);
  setupDirtyTracking();
  updateSaveAllButtons();
}

// 將單一題目轉成 HTML 字串（addQ / renderQs 共用）
function questionHTML(q) {
  let opts = [];
  if (q.options) {
    if (Array.isArray(q.options)) opts = q.options;
    else if (typeof q.options === 'string') { try { opts = JSON.parse(q.options); } catch(_) {} }
  }
  if (!Array.isArray(opts)) opts = [];
  const isSection = q.question_type === 'section';
  const optLabel = isSection ? '章節說明文字（顯示在標題下方）' : '選項（每行一個；含「其他」者前台自動加文字欄）';
  const showOpts = HAS_OPTIONS.has(q.question_type);
  const qidStr = typeof q.id === 'string' ? `'${q.id}'` : q.id;
  return `<div class="border rounded-lg p-4 ${isSection?'bg-indigo-50/40 border-indigo-200':''}" data-qid="${q.id}">
      <div class="grid md:grid-cols-12 gap-3 text-sm">
        <div class="md:col-span-3"><label class="text-xs text-slate-500">題型</label>
          <select data-f="type" class="w-full border rounded px-2 py-1.5" onchange="onTypeChange(this)">
            ${TYPE_OPTIONS.map(([v,l]) => `<option value="${v}" ${q.question_type===v?'selected':''}>${l}</option>`).join('')}
          </select></div>
        <div class="md:col-span-7"><label class="text-xs text-slate-500">${isSection?'章節標題':'題目（支援換行）'}</label>
          <textarea data-f="text" rows="2" class="w-full border rounded px-2 py-1.5">${esc(q.question_text)}</textarea></div>
        <div class="md:col-span-2"><label class="text-xs text-slate-500">順序</label>
          <input type="number" data-f="order" value="${q.sort_order}" class="w-full border rounded px-2 py-1.5"></div>
      </div>
      <div class="mt-3" data-opts-row ${showOpts?'':'style="display:none"'}>
        <label class="text-xs text-slate-500">${optLabel}</label>
        <textarea data-f="options" rows="${isSection?2:4}" class="w-full border rounded px-2 py-1.5 font-mono text-xs">${esc(opts.join('\n'))}</textarea></div>
      <div class="mt-3 flex flex-wrap gap-4 text-xs">
        <label class="flex items-center gap-1"><input type="checkbox" data-f="required" ${q.is_required?'checked':''}>必填</label>
        <label class="flex items-center gap-1"><input type="checkbox" data-f="stat" ${q.include_in_statistics?'checked':''}>納入統計</label>
        <label class="flex items-center gap-1"><input type="checkbox" data-f="sat" ${q.is_satisfaction_score?'checked':''}>滿意度評分題</label>
        <label class="flex items-center gap-1"><input type="checkbox" data-f="overall" ${q.is_overall_score?'checked':''}>整體滿意度</label>
        <div class="ml-auto flex items-center gap-3">
          <span data-dirty-flag class="hidden text-xs text-amber-600 font-medium">● 未儲存</span>
          <button onclick="delQ(${qidStr})" class="text-red-600 hover:underline text-xs">刪除</button>
        </div>
      </div></div>`;
}

function renderQs(qs) {
  const list = document.getElementById('qList');
  // 控制底部「+ 章節 / + 新增題目」顯示
  const bottomAdd = document.getElementById('qBottomAdd');
  if (bottomAdd) bottomAdd.classList.toggle('hidden', !qs.length);
  if (bottomAdd && qs.length) bottomAdd.classList.add('flex');
  if (!qs.length) { list.innerHTML = '<div class="text-center text-slate-400 py-8 border border-dashed rounded-lg">尚無題目</div>'; return; }
  list.innerHTML = qs.map(questionHTML).join('');
}

// 僅將 ONE 個題目追加到 DOM 尾端（addQ 用，避免全部重繪）
function appendQuestionDOM(q) {
  const list = document.getElementById('qList');
  // 若本來是空白訊息要清掉
  if (list.querySelector('.border-dashed')) list.innerHTML = '';
  const wrapper = document.createElement('div');
  wrapper.innerHTML = questionHTML(q);
  const el = wrapper.firstElementChild;
  list.appendChild(el);
  return el;
}

// 題型切換時：同步顯示/隱藏選項欄，並更新標籤文字 & 章節底色
function onTypeChange(sel) {
  const root = sel.closest('[data-qid]');
  if (!root) return;
  const type = sel.value;
  root.dataset.type = type;
  const isSection = type === 'section';
  const showOpts = HAS_OPTIONS.has(type);

  // 選項欄顯示/隱藏
  const optsRow = root.querySelector('[data-opts-row]');
  if (optsRow) {
    optsRow.style.display = showOpts ? '' : 'none';
    // 更新標籤文字
    const label = optsRow.querySelector('label');
    if (label) {
      label.textContent = isSection
        ? '章節說明文字（顯示在標題下方）'
        : '選項（每行一個；含「其他」者前台自動加文字欄）';
    }
    // 章節說明用 2 行，一般題目用 4 行
    const ta = optsRow.querySelector('textarea[data-f="options"]');
    if (ta) ta.rows = isSection ? 2 : 4;
  }

  // 題目文字欄的標籤也要切換（章節標題 vs 題目）
  const textLabel = root.querySelector('label[for=""], .md\\:col-span-7 label');
  if (textLabel) {
    textLabel.textContent = isSection ? '章節標題' : '題目（支援換行）';
  }

  // 章節背景色
  if (isSection) {
    root.classList.add('bg-indigo-50/40', 'border-indigo-200');
  } else {
    root.classList.remove('bg-indigo-50/40', 'border-indigo-200');
  }
}

// 從 DOM 移除某一題（delQ 用）
function removeQuestionDOM(qid) {
  const el = document.querySelector(`[data-qid="${qid}"]`);
  if (el) el.remove();
  // 列表變空時顯示空白訊息
  const list = document.getElementById('qList');
  if (!list.children.length) {
    list.innerHTML = '<div class="text-center text-slate-400 py-8 border border-dashed rounded-lg">尚無題目</div>';
  }
}

// 全域本地狀態：避免每次操作都重新跟後端拉一次完整題目
let _questions = [];
// 追蹤哪些題目有未儲存的變更
const _dirty = new Set();

function markDirty(qid) {
  const key = String(qid);
  _dirty.add(key);
  updateSaveAllButtons();
  const el = document.querySelector(`[data-qid="${qid}"]`);
  if (el) {
    el.classList.add('ring-1', 'ring-amber-300');
    const flag = el.querySelector('[data-dirty-flag]');
    if (flag) flag.classList.remove('hidden');
  }
}

function clearDirty(qid) {
  const key = String(qid);
  _dirty.delete(key);
  updateSaveAllButtons();
  const el = document.querySelector(`[data-qid="${qid}"]`);
  if (el) {
    el.classList.remove('ring-1', 'ring-amber-300');
    const flag = el.querySelector('[data-dirty-flag]');
    if (flag) flag.classList.add('hidden');
  }
}

function updateSaveAllButtons() {
  const n = _dirty.size;
  const text = n > 0 ? `儲存全部變更（${n}）` : '全部已儲存 ✓';
  const onClass = ['bg-amber-600','hover:bg-amber-700','text-white'];
  const offClass = ['bg-slate-200','text-slate-400','cursor-not-allowed'];
  ['saveAllBtnTop','saveAllBtnBottom'].forEach(id => {
    const b = document.getElementById(id);
    if (!b) return;
    b.textContent = text;
    b.disabled = n === 0;
    onClass.forEach(c => b.classList.toggle(c, n > 0));
    offClass.forEach(c => b.classList.toggle(c, n === 0));
  });
  const fab = document.getElementById('fabSave');
  if (fab) {
    fab.disabled = n === 0;
    if (n > 0) {
      fab.className = 'bg-amber-600 hover:bg-amber-700 text-white rounded-full shadow-lg w-12 h-12 text-lg flex items-center justify-center transition-transform hover:scale-105 active:scale-95 animate-pulse';
      fab.title = `儲存全部變更（${n}）`;
    } else {
      fab.className = 'bg-slate-300 text-slate-500 cursor-not-allowed rounded-full shadow-lg w-12 h-12 text-lg flex items-center justify-center';
      fab.title = '全部已儲存';
    }
  }
}

// 透過事件委派監聽 qList 內所有 input/change，自動標 dirty
function setupDirtyTracking() {
  const list = document.getElementById('qList');
  if (!list || list._dirtyBound) return;
  list._dirtyBound = true;
  ['input', 'change'].forEach(ev => {
    list.addEventListener(ev, (e) => {
      const root = e.target.closest('[data-qid]');
      if (root && root.dataset.qid) markDirty(root.dataset.qid);
    });
  });
}

// 一次儲存所有有變更的題目
async function saveAll() {
  const ids = Array.from(_dirty).filter(qid => !qid.startsWith('tmp_'));
  if (!ids.length) return;

  ['saveAllBtnTop','saveAllBtnBottom'].forEach(id => {
    const b = document.getElementById(id);
    if (b) { b.disabled = true; b.textContent = `儲存中… (0/${ids.length})`; }
  });

  let done = 0, fails = [];
  // 並行送出，速度最快
  const results = await Promise.allSettled(ids.map(async (qid) => {
    const body = _collectBody(qid);
    if (!body) return;
    try {
      const r = await API.put('/api/admin/questions/' + qid, body);
      const idx = _questions.findIndex(q => String(q.id) === qid);
      if (idx >= 0) {
        _questions[idx] = r.question || { ..._questions[idx], ..._payloadToQuestion(body) };
      }
      clearDirty(qid);
    } catch (e) {
      fails.push(qid + ': ' + e.message);
      throw e;
    } finally {
      done++;
      ['saveAllBtnTop','saveAllBtnBottom'].forEach(id => {
        const b = document.getElementById(id);
        if (b) b.textContent = `儲存中… (${done}/${ids.length})`;
      });
    }
  }));

  updateSaveAllButtons();

  if (fails.length) {
    alert(`儲存完成：成功 ${ids.length - fails.length} 題、失敗 ${fails.length} 題\n\n失敗：\n` + fails.join('\n'));
  } else {
    showToast(`已儲存 ${ids.length} 題變更 ✓`);
  }
}

function showToast(msg) {
  let toast = document.getElementById('saveToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'saveToast';
    toast.style.cssText = 'position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:60;background:#16a34a;color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s';
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = '1';
  setTimeout(() => { toast.style.opacity = '0'; }, 1800);
}

// 離開頁面前提醒未儲存
window.addEventListener('beforeunload', (e) => {
  if (_dirty.size > 0) {
    e.preventDefault();
    e.returnValue = '';
  }
});

// 忙碌指示器：延遲 500ms 顯示，快的時候完全看不到
let _busyTimer = null;
function setBusyDelayed(label, delay = 500) {
  cancelBusy();
  _busyTimer = setTimeout(() => {
    let el = document.getElementById('busyBar');
    if (!el) {
      el = document.createElement('div');
      el.id = 'busyBar';
      el.className = 'fixed top-2 right-2 z-50 bg-amber-50 border border-amber-300 text-amber-800 px-3 py-1.5 rounded text-xs shadow-md';
      document.body.appendChild(el);
    }
    el.textContent = label;
    el.classList.remove('hidden');
  }, delay);
}
function cancelBusy() {
  if (_busyTimer) { clearTimeout(_busyTimer); _busyTimer = null; }
  const el = document.getElementById('busyBar');
  if (el) el.classList.add('hidden');
}

// addQ：局部 DOM append + 即時滾動（不等 API）
async function addQ(typ) {
  const isSection = typ === 'section';
  const payload = {
    question_text: isSection ? '新章節' : '新題目',
    question_type: typ || 'single',
    is_required: !isSection,
    options: isSection ? ['（可選）章節說明文字']
      : (typ === 'single' || typ === 'multiple' || typ === 'select' ? ['選項1','選項2'] : null),
    sort_order: (_questions.reduce((m, q) => Math.max(m, q.sort_order||0), 0) || 0) + 1,
    include_in_statistics: !isSection,
    is_active: true,
  };

  // 1) 立即新增到本地狀態 + 局部 append DOM（不重繪全部）
  const tempId = 'tmp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
  const optimistic = { id: tempId, ..._payloadToQuestion(payload) };
  _questions.push(optimistic);
  const newEl = appendQuestionDOM(optimistic);

  // 2) 即時滾動到新題目（瞬間，不用平滑動畫）
  if (newEl) {
    newEl.scrollIntoView({ behavior: 'auto', block: 'center' });
    // 短暫高亮提示
    newEl.classList.add('ring-2', 'ring-emerald-400');
    setTimeout(() => newEl.classList.remove('ring-2', 'ring-emerald-400'), 800);
  }

  // 3) 延遲 500ms 才顯示「儲存中…」(快的時候完全看不到)
  setBusyDelayed('背景同步中…');

  try {
    const r = await API.post('/api/admin/surveys/' + sid + '/questions', payload);
    cancelBusy();
    // 把臨時 id 換成後端回傳的真 id（不重繪畫面，只更新 dataset 跟 _questions）
    const realQ = r.question || { ...optimistic, id: r.id };
    const idx = _questions.findIndex(q => q.id === tempId);
    if (idx >= 0) _questions[idx] = realQ;
    if (newEl) {
      newEl.setAttribute('data-qid', String(realQ.id));
      // 更新刪除按鈕綁定的 id
      const delBtn = newEl.querySelector('button[onclick^="delQ"]');
      if (delBtn) delBtn.setAttribute('onclick', `delQ(${realQ.id})`);
    }
    // 若 tmp_id 已被標記 dirty（使用者邊新增邊改），轉移到真 id
    if (_dirty.has(tempId)) {
      _dirty.delete(tempId);
      _dirty.add(String(realQ.id));
      updateSaveAllButtons();
    }
  } catch (e) {
    cancelBusy();
    alert('新增失敗：' + e.message);
    _questions = _questions.filter(q => q.id !== tempId);
    _dirty.delete(tempId);
    updateSaveAllButtons();
    if (newEl) newEl.remove();
  }
}

// 把送出的 payload 轉成題目顯示格式
function _payloadToQuestion(p) {
  return {
    question_text: p.question_text,
    question_type: p.question_type,
    is_required: p.is_required ? 1 : 0,
    options: p.options ? JSON.stringify(p.options) : null,
    sort_order: p.sort_order || 0,
    is_active: 1,
    include_in_statistics: p.include_in_statistics ? 1 : 0,
    is_satisfaction_score: 0,
    is_overall_score: 0,
  };
}

// 收集編輯中題目的目前 form 值
function _collectBody(qid) {
  const root = document.querySelector(`[data-qid="${qid}"]`);
  if (!root) return null;
  const type = root.querySelector('[data-f="type"]').value;
  const opts = root.querySelector('[data-f="options"]').value.split('\n').map(s=>s.trim()).filter(Boolean);
  return {
    question_text: root.querySelector('[data-f="text"]').value,
    question_type: type,
    is_required: root.querySelector('[data-f="required"]').checked,
    options: HAS_OPTIONS.has(type) ? opts : null,
    sort_order: +root.querySelector('[data-f="order"]').value || 0,
    is_active: true,
    include_in_statistics: root.querySelector('[data-f="stat"]').checked,
    is_satisfaction_score: root.querySelector('[data-f="sat"]').checked,
    is_overall_score: root.querySelector('[data-f="overall"]').checked
  };
}

async function saveQ(qid) {
  // 臨時 id（剛新增還沒回來）不能存
  if (typeof qid === 'string' && qid.startsWith('tmp_')) {
    alert('題目剛新增，請稍候再儲存。');
    return;
  }
  const body = _collectBody(qid);
  if (!body) return;
  const root = document.querySelector(`[data-qid="${qid}"]`);
  const m = root.querySelector('[data-msg]');
  m.textContent = '儲存中…'; m.className = 'text-slate-500 text-xs';
  try {
    const r = await API.put('/api/admin/questions/' + qid, body);
    // 更新本地狀態
    const idx = _questions.findIndex(q => q.id === qid);
    if (idx >= 0) {
      _questions[idx] = r.question || { ..._questions[idx], ..._payloadToQuestion(body) };
    }
    m.textContent = '已儲存 ✓'; m.className = 'text-green-600 text-xs';
    setTimeout(() => m.textContent = '', 2000);
  } catch (e) {
    m.textContent = '失敗：' + e.message; m.className = 'text-red-600 text-xs';
  }
}

async function delQ(qid) {
  if (typeof qid === 'string' && String(qid).startsWith('tmp_')) {
    _questions = _questions.filter(q => q.id !== qid);
    _dirty.delete(String(qid));
    updateSaveAllButtons();
    removeQuestionDOM(qid);
    return;
  }
  if (!confirm('確定刪除此題？')) return;
  const backup = _questions.find(q => q.id === qid);
  _questions = _questions.filter(q => q.id !== qid);
  _dirty.delete(String(qid));
  updateSaveAllButtons();
  removeQuestionDOM(qid);

  setBusyDelayed('刪除中…');
  try {
    await API.del('/api/admin/questions/' + qid);
    cancelBusy();
  } catch (e) {
    cancelBusy();
    if (backup) {
      _questions.push(backup);
      _questions.sort((a, b) => (a.sort_order||0) - (b.sort_order||0));
      renderQs(_questions);
    }
    alert('刪除失敗：' + e.message);
  }
}

// reloadQs 保留作為「真的需要從 DB 重抓」時用（一般操作不會用到）
async function reloadQs() {
  const { questions } = await API.get('/api/admin/surveys/' + sid);
  _questions = questions || [];
  renderQs(_questions);
}

load();
</script>
