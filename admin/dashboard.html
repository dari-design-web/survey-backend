<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<script>renderAdminHeader('dashboard');</script>
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  <h1 class="text-2xl font-bold mb-5">統計儀表板</h1>
  <div id="cards" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
  <div id="neg"></div>
  <div class="grid md:grid-cols-2 gap-5">
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">每日填寫趨勢（近 30 天）</h3><canvas id="dailyChart" height="120"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">每月填寫趨勢（近 12 個月）</h3><canvas id="monthlyChart" height="120"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">各項滿意度平均</h3><canvas id="satChart" height="160"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">整體滿意度分布</h3><canvas id="distChart" height="160"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">來訪目的比例</h3><canvas id="purposeChart" height="160"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">主要使用服務比例</h3><canvas id="serviceChart" height="160"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">兌換券狀態</h3><canvas id="couponChart" height="160"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">開放式意見類別</h3><canvas id="kwChart" height="160"></canvas></div>
  </div>
</main>
<script>
const COLORS = ['#2563EB','#10B981','#F59E0B','#EF4444','#8B5CF6','#06B6D4','#EC4899','#14B8A6','#F97316'];
function lineChart(id, labels, values, label){ new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{label,data:values,borderColor:'#2563EB',backgroundColor:'rgba(37,99,235,.1)',tension:.3,fill:true}]},options:{plugins:{legend:{display:false}}}}); }
function barChart(id, labels, values){ new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:'#2563EB'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:5}}}}); }
function pieChart(id, labels, values){ new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:COLORS}]},options:{plugins:{legend:{position:'right'}}}}); }
function colBar(id, labels, values, color){ new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:color||'#10B981'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}}); }

(async () => {
  const data = await API.get('/api/admin/dashboard');
  const c = data.cards;
  const cards = [
    ['總問卷數', c.totalResponses, 'text-blue-700'],
    ['今日填寫', c.todayResponses, 'text-emerald-700'],
    ['本月填寫', c.monthResponses, 'text-sky-700'],
    ['平均整體滿意度', c.overallAvg != null ? c.overallAvg + ' / 5' : '—', 'text-indigo-700'],
    ['產生兌換券數', c.totalCoupons, 'text-slate-700'],
    ['已兌換', c.redeemedCoupons, 'text-green-700'],
    ['未兌換', c.issuedCoupons, 'text-amber-700'],
    ['兌換率', c.redemptionRate + '%', 'text-purple-700'],
  ];
  document.getElementById('cards').innerHTML = cards.map(([k, v, cls]) =>
    `<div class="bg-white rounded-xl border p-4"><div class="text-xs text-slate-500 mb-1">${k}</div><div class="text-2xl font-bold ${cls}">${v}</div></div>`).join('');
  if (c.monthNegative > 0) {
    document.getElementById('neg').innerHTML = `<div class="bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-sm">⚠️ 本月有 <strong class="text-red-700">${c.monthNegative}</strong> 筆不滿意回饋，請進入「填答資料」查看。</div>`;
  }
  lineChart('dailyChart', data.dailyTrend.map(r => r.d), data.dailyTrend.map(r => r.c), '每日');
  lineChart('monthlyChart', data.monthlyTrend.map(r => r.m), data.monthlyTrend.map(r => r.c), '每月');
  barChart('satChart', data.satisfactionAvg.map(r => r.label), data.satisfactionAvg.map(r => r.avg || 0));
  colBar('distChart', data.overallDist.map(r => r.score + '分'), data.overallDist.map(r => r.c), '#8B5CF6');
  pieChart('purposeChart', data.purposeDist.map(r => r.label), data.purposeDist.map(r => r.c));
  pieChart('serviceChart', data.serviceDist.map(r => r.label), data.serviceDist.map(r => r.c));
  const cmap = {issued:'未兌換',redeemed:'已兌換',expired:'已逾期',voided:'已作廢',invalid:'無效'};
  pieChart('couponChart', data.couponStatus.map(r => cmap[r.label] || r.label), data.couponStatus.map(r => r.c));
  colBar('kwChart', data.keywords.map(r => r.label), data.keywords.map(r => r.c), '#EC4899');
})();
</script>
</body>
</html>
