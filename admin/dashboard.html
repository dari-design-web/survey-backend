<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>儀表板</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="../config.js"></script>
<script src="../js/common.js"></script>
<script src="../js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
<script>renderAdminHeader('dashboard');</script>
<main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
  <h1 class="text-2xl font-bold mb-5">統計儀表板</h1>
  <div id="cards" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
  <div id="neg"></div>
  <div class="grid md:grid-cols-2 gap-5">
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">每日填寫趨勢（近 30 天）</h3><canvas id="dailyChart" height="120"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">每月填寫趨勢（近 12 個月）</h3><canvas id="monthlyChart" height="120"></canvas></div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">各項滿意度平均</h3><canvas id="satChart" height="180"></canvas></div>
    <div class="bg-white rounded-xl border p-4">
      <h3 class="text-sm font-bold mb-1">滿意度評分分布（1-5 分，%）</h3>
      <p class="text-[11px] text-slate-500 mb-2">彙總所有滿意度評分題（Q6~Q14）的填答分布</p>
      <canvas id="distChart" height="160"></canvas>
    </div>
    <div class="bg-white rounded-xl border p-4 md:col-span-2">
      <div class="flex flex-wrap items-baseline gap-4 mb-3">
        <h3 class="text-sm font-bold">NPS 推薦分數分布（0-10 分，%）</h3>
        <div id="npsSummary" class="text-xs text-slate-600 flex flex-wrap gap-3"></div>
      </div>
      <canvas id="npsChart" height="80"></canvas>
    </div>
    <div class="bg-white rounded-xl border p-4">
      <h3 class="text-sm font-bold mb-3">民眾身分別分布</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
        <div id="purposeBox" class="relative min-h-[160px]"><canvas id="purposeChart"></canvas></div>
        <div id="purposeTable" class="text-xs"></div>
      </div>
    </div>
    <div class="bg-white rounded-xl border p-4">
      <h3 class="text-sm font-bold mb-3">使用服務類型分布</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
        <div id="serviceBox" class="relative min-h-[160px]"><canvas id="serviceChart"></canvas></div>
        <div id="serviceTable" class="text-xs"></div>
      </div>
    </div>
    <div class="bg-white rounded-xl border p-4">
      <h3 class="text-sm font-bold mb-3">兌換券狀態</h3>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center">
        <div id="couponBox" class="relative min-h-[160px]"><canvas id="couponChart"></canvas></div>
        <div id="couponTable" class="text-xs"></div>
      </div>
    </div>
    <div class="bg-white rounded-xl border p-4"><h3 class="text-sm font-bold mb-3">開放式意見類別</h3><canvas id="kwChart" height="160"></canvas></div>
  </div>

  <!-- 最新民眾意見原文 -->
  <div class="bg-white rounded-xl border p-4 mt-5">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-bold">最新民眾意見原文（近 30 筆）</h3>
      <a href="responses.html" class="text-xs text-brand-600 hover:underline">查看全部填答 →</a>
    </div>
    <div id="commentsList" class="space-y-3">
      <div class="text-center py-8 text-slate-400 text-sm">載入中…</div>
    </div>
  </div>
</main>
<script>
const COLORS = ['#2563EB','#10B981','#F59E0B','#EF4444','#8B5CF6','#06B6D4','#EC4899','#14B8A6','#F97316'];

function lineChart(id, labels, values, label){
  if (!values.length) { showEmpty(id, '尚無資料'); return; }
  new Chart(document.getElementById(id),{type:'line',data:{labels,datasets:[{label,data:values,borderColor:'#2563EB',backgroundColor:'rgba(37,99,235,.1)',tension:.3,fill:true}]},options:{plugins:{legend:{display:false}}}});
}
function barChart(id, labels, values){
  if (!values.length) { showEmpty(id, '尚無資料'); return; }
  new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:'#2563EB'}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:5}}}});
}
function pieChart(id, labels, values, boxId){
  if (!values.length) { showEmpty(id, '尚無資料', boxId); return; }
  new Chart(document.getElementById(id),{type:'doughnut',data:{labels,datasets:[{data:values,backgroundColor:COLORS}]},options:{plugins:{legend:{position:'right'}}}});
}

function escHtmlSafe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}

// 圓餅圖 + 明細表（顯示數量 / 百分比）
function pieWithTable(chartId, tableId, boxId, items) {
  // items: [{label, c}]
  const total = items.reduce((sum, it) => sum + (it.c || 0), 0);
  if (!total) {
    if (boxId) {
      const box = document.getElementById(boxId);
      if (box) box.innerHTML = '<div class="flex items-center justify-center h-40 text-slate-400 text-sm">尚無資料</div>';
    }
    const tbl = document.getElementById(tableId);
    if (tbl) tbl.innerHTML = '';
    return;
  }
  const enriched = items.map((it, i) => ({
    ...it,
    pct: total ? (it.c / total * 100) : 0,
    color: COLORS[i % COLORS.length],
  }));

  // 畫圖
  new Chart(document.getElementById(chartId), {
    type: 'doughnut',
    data: {
      labels: enriched.map(e => e.label),
      datasets: [{
        data: enriched.map(e => e.c),
        backgroundColor: enriched.map(e => e.color),
        borderWidth: 1,
        borderColor: '#fff',
      }],
    },
    options: {
      plugins: {
        legend: { display: false }, // 改用旁邊明細表
        tooltip: {
          callbacks: {
            label: (c) => {
              const pct = (c.parsed / total * 100).toFixed(1);
              return `${c.label}：${c.parsed} 人 (${pct}%)`;
            }
          }
        }
      }
    }
  });

  // 明細表
  const rows = enriched.map(e => `
    <tr>
      <td class="py-1.5 pr-2 align-top">
        <span class="inline-block w-3 h-3 rounded-sm align-middle" style="background:${e.color}"></span>
      </td>
      <td class="py-1.5 pr-2 align-top">${escHtmlSafe(e.label)}</td>
      <td class="py-1.5 pr-2 text-right align-top tabular-nums">${e.c} 人</td>
      <td class="py-1.5 text-right align-top tabular-nums font-bold text-slate-700">${e.pct.toFixed(1)}%</td>
    </tr>`).join('');
  const tbl = document.getElementById(tableId);
  if (tbl) {
    tbl.innerHTML = `
      <table class="w-full">
        <thead>
          <tr class="text-[11px] text-slate-500 border-b border-slate-200">
            <th class="py-1.5 pr-2 w-4"></th>
            <th class="py-1.5 pr-2 text-left">類別</th>
            <th class="py-1.5 pr-2 text-right">數量</th>
            <th class="py-1.5 text-right">百分比</th>
          </tr>
        </thead>
        <tbody>${rows}
          <tr class="border-t border-slate-200 font-bold">
            <td class="py-1.5 pr-2"></td>
            <td class="py-1.5 pr-2">合計</td>
            <td class="py-1.5 pr-2 text-right tabular-nums">${total} 人</td>
            <td class="py-1.5 text-right tabular-nums">100%</td>
          </tr>
        </tbody>
      </table>`;
  }
}
function colBar(id, labels, values, color){
  if (!values.length) { showEmpty(id, '尚無資料'); return; }
  new Chart(document.getElementById(id),{type:'bar',data:{labels,datasets:[{data:values,backgroundColor:color||'#10B981'}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}});
}

// NPS 分群上色：0-6 紅色（批評者）、7-8 黃色（中立）、9-10 綠色（推薦）
function npsColors() {
  return Array.from({length: 11}, (_, i) => {
    if (i <= 6) return '#EF4444';
    if (i <= 8) return '#F59E0B';
    return '#10B981';
  });
}

// 通用：百分比長條圖（Y 軸固定 0~100%，bar 上顯示 %）
function renderPctBar(id, labels, values, color) {
  if (!values.length) { showEmpty(id, '尚無資料'); return; }
  const bgColor = Array.isArray(color) ? color : (color || '#8B5CF6');
  const ctx = document.getElementById(id);
  if (!ctx) return;
  new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data: values, backgroundColor: bgColor, borderRadius: 4 }] },
    options: {
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: c => c.parsed.y + '%' }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          suggestedMax: Math.max(10, Math.ceil(Math.max(...values) / 10) * 10),
          ticks: { callback: v => v + '%' }
        }
      }
    }
  });
}
function showEmpty(canvasId, msg, boxId){
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const parent = boxId ? document.getElementById(boxId) : canvas.parentElement;
  if (parent) {
    parent.innerHTML = `<div class="flex items-center justify-center h-40 text-slate-400 text-sm">${msg}</div>`;
  }
}

(async () => {
  const data = await API.get('/api/admin/dashboard');
  const c = data.cards;
  const cards = [
    ['總問卷數', c.totalResponses, 'text-blue-700'],
    ['今日填寫', c.todayResponses, 'text-emerald-700'],
    ['本月填寫', c.monthResponses, 'text-sky-700'],
    ['平均整體滿意度', c.overallAvg != null ? c.overallAvg + ' / 5' : '—', 'text-indigo-700'],
    ['產生兌換券數', c.totalCoupons, 'text-slate-700'],
    ['已兌換', c.redeemedCoupons, 'text-green-700'],
    ['未兌換', c.issuedCoupons, 'text-amber-700'],
    ['兌換率', c.redemptionRate + '%', 'text-purple-700'],
  ];
  document.getElementById('cards').innerHTML = cards.map(([k, v, cls]) =>
    `<div class="bg-white rounded-xl border p-4"><div class="text-xs text-slate-500 mb-1">${k}</div><div class="text-2xl font-bold ${cls}">${v}</div></div>`).join('');
  if (c.monthNegative > 0) {
    document.getElementById('neg').innerHTML = `<div class="bg-red-50 border border-red-200 rounded-xl p-4 mb-6 text-sm">⚠️ 本月有 <strong class="text-red-700">${c.monthNegative}</strong> 筆不滿意回饋，請進入「填答資料」查看。</div>`;
  }
  lineChart('dailyChart', data.dailyTrend.map(r => r.d), data.dailyTrend.map(r => r.c), '每日');
  lineChart('monthlyChart', data.monthlyTrend.map(r => r.m), data.monthlyTrend.map(r => r.c), '每月');
  barChart('satChart', data.satisfactionAvg.map(r => r.label), data.satisfactionAvg.map(r => r.avg || 0));

  // 整體滿意度分布 — 改成百分比，永遠 1~5 都顯示
  renderPctBar('distChart',
    (data.overallDist || []).map(r => r.score + '分'),
    (data.overallDist || []).map(r => r.pct),
    '#8B5CF6');

  // NPS 0~10 分布 — 百分比
  renderPctBar('npsChart',
    (data.npsDist || []).map(r => r.score + '分'),
    (data.npsDist || []).map(r => r.pct),
    npsColors());

  // NPS 三類摘要
  const s = data.npsSummary;
  if (s && s.total > 0) {
    document.getElementById('npsSummary').innerHTML = `
      <span class="px-2 py-1 rounded bg-green-50 text-green-700">推薦者 9-10：<b>${s.promoters_pct}%</b>（${s.promoters} 人）</span>
      <span class="px-2 py-1 rounded bg-amber-50 text-amber-700">中立者 7-8：<b>${s.passives_pct}%</b>（${s.passives} 人）</span>
      <span class="px-2 py-1 rounded bg-red-50 text-red-700">批評者 0-6：<b>${s.detractors_pct}%</b>（${s.detractors} 人）</span>
      <span class="px-2 py-1 rounded bg-slate-100 text-slate-800">NPS 分數：<b>${s.score}</b></span>`;
  } else {
    document.getElementById('npsSummary').textContent = '尚無 NPS 填答';
  }
  pieWithTable('purposeChart', 'purposeTable', 'purposeBox', data.purposeDist || []);
  pieWithTable('serviceChart', 'serviceTable', 'serviceBox', data.serviceDist || []);

  // 兌換券狀態 — 隱藏數量為 0 的，並把英文 status 轉中文
  const cmap = {issued:'未兌換',redeemed:'已兌換',expired:'已逾期',voided:'已作廢',invalid:'無效'};
  const couponItems = (data.couponStatus || [])
    .filter(r => (r.c || 0) > 0)
    .map(r => ({ label: cmap[r.label] || r.label, c: r.c }));
  pieWithTable('couponChart', 'couponTable', 'couponBox', couponItems);
  colBar('kwChart', data.keywords.map(r => r.label), data.keywords.map(r => r.c), '#EC4899');
  renderComments(data.recentComments || []);
})();

function escHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}

function renderComments(items) {
  const box = document.getElementById('commentsList');
  if (!items.length) {
    box.innerHTML = '<div class="text-center py-8 text-slate-400 text-sm">尚無民眾意見</div>';
    return;
  }
  box.innerHTML = items.map(item => {
    const date = (item.submitted_at || '').slice(0, 16).replace('T', ' ');
    return `
      <div class="border-l-4 border-brand-400 bg-slate-50 px-4 py-3 rounded-r-lg">
        <div class="flex justify-between items-start gap-2 mb-1">
          <div class="text-xs font-bold text-slate-600">${escHtml(item.question_text)}</div>
          <div class="text-[11px] text-slate-400 shrink-0">${escHtml(date)}</div>
        </div>
        <div class="text-sm text-slate-800 whitespace-pre-wrap leading-relaxed">${escHtml(item.answer_text)}</div>
        ${item.response_id ? `<div class="mt-1.5 text-right"><a href="responses.html#r${item.response_id}" class="text-[11px] text-brand-600 hover:underline">查看完整填答 →</a></div>` : ''}
      </div>`;
  }).join('');
}
</script>
</body>
</html>
