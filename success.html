<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>送出完成</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',sans-serif} .pre{white-space:pre-line}</style>
</head>
<body class="bg-slate-50 text-slate-800">
<main class="max-w-md mx-auto px-5 py-8 min-h-screen" id="root">
  <div class="text-center py-12 text-slate-400">載入中…</div>
</main>

<script>
const q = new URLSearchParams(location.search);
const code = q.get('code');
const reason = q.get('reason');
const nextDate = q.get('nextDate');
const naUrl = q.get('naUrl') || '';
const naLabel = q.get('naLabel') || '';
const naHint = q.get('naHint') || '';
const root = document.getElementById('root');

// 產生「下一步引導」按鈕 HTML（如果有設定的話）
function nextActionHTML(surveyObj) {
  // 優先用 URL 參數,退回 survey 物件
  const url = naUrl || surveyObj?.next_action_url || '';
  const label = naLabel || surveyObj?.next_action_label || '';
  const hint = naHint || surveyObj?.next_action_hint || '';
  if (!url || !label) return '';
  return `
    <div class="mt-6 bg-gradient-to-br from-brand-50 to-cyan-50 border-2 border-brand-300 rounded-2xl p-5 text-center">
      ${hint ? `<p class="text-sm text-slate-700 mb-3 leading-relaxed">${esc(hint)}</p>` : ''}
      <a href="${esc(url)}" target="_blank"
         class="inline-block w-full bg-gradient-to-r from-brand-600 to-cyan-600 hover:opacity-90 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
        ${esc(label)}
      </a>
    </div>`;
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}

const DEFAULT_THANKS = '感謝您完成本次滿意度調查！\n您的意見將作為我們持續改善服務品質、環境設施與整體體驗的重要參考。\n請出示下方兌換券 QR Code 至指定地點兌換贈品。';

const TERMS = [
  '本券限完成問卷後取得，限本人使用。',
  '每一兌換識別每月限兌換一次。',
  '本券不得轉售、兌換現金或折抵其他消費。',
  '本券逾期失效，恕不補發。',
  '贈品數量有限，兌完為止。',
  '主辦單位保有活動內容調整、兌換資格審核及最終解釋之權利。'
];

// 兌換狀態對應
const STATUS_MAP = {
  issued:   ['未兌換', 'green'],
  redeemed: ['已兌換', 'slate'],
  expired:  ['已逾期', 'red'],
  voided:   ['已作廢', 'red'],
  invalid:  ['無效',   'red']
};

// 先檢查 sessionStorage 有沒有剛送出時 survey.html 暫存的 coupon
function readCache(code) {
  try {
    const raw = sessionStorage.getItem('coupon_cache_' + code);
    if (!raw) return null;
    const data = JSON.parse(raw);
    // 30 秒內的快取才算數（避免顯示過期狀態）
    if (Date.now() - (data.t || 0) > 30000) return null;
    return data;
  } catch(_) { return null; }
}

(async () => {
  if (code) {
    // 先試 sessionStorage 快取（剛送出時的即時資料）
    const cached = readCache(code);
    if (cached && cached.coupon) {
      renderCoupon(cached.coupon, cached.survey);
      // 立即顯示後，背景靜默更新一次（不阻塞畫面）
      API.get('/api/public/coupons/' + encodeURIComponent(code))
        .then(r => renderCoupon(r.coupon, r.survey))
        .catch(() => {});
      return;
    }
    try {
      const { coupon, survey } = await API.get('/api/public/coupons/' + encodeURIComponent(code));
      renderCoupon(coupon, survey);
    } catch (e) {
      root.innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4">無法載入兌換券：${esc(e.message)}</div>`;
    }
  } else if (reason === 'interval_not_met') {
    root.innerHTML = `
      <div class="text-center mb-6">
        <div class="inline-flex w-16 h-16 rounded-full bg-amber-100 items-center justify-center mb-3 text-2xl">⚠️</div>
        <h1 class="text-2xl font-bold">問卷已送出</h1>
        <p class="text-sm text-slate-500 mt-1">感謝您的回饋</p>
      </div>
      <div class="bg-white border border-amber-200 rounded-xl p-6 text-center">
        <p class="text-slate-700">您已於一個月內兌換過贈品</p>
        ${nextDate ? `<p class="mt-2 text-lg font-bold text-amber-600">下次可兌換日期：${esc(nextDate)}</p>` : ''}
      </div>
      ${nextActionHTML()}
      <a href="index.html" class="mt-6 block text-center text-sm text-slate-500">返回首頁</a>`;
  } else {
    root.innerHTML = `
      <div class="text-center">
        <div class="inline-flex w-16 h-16 rounded-full bg-green-100 items-center justify-center mb-3 text-2xl">✅</div>
        <h1 class="text-2xl font-bold">問卷已送出</h1>
        <p class="text-sm text-slate-500 mt-3 pre">${esc(DEFAULT_THANKS)}</p>
      </div>
      ${nextActionHTML()}
      <a href="index.html" class="mt-6 block text-center text-sm text-slate-500">返回首頁</a>`;
  }
})();

function renderCoupon(coupon, survey) {
  const thanks = survey?.thank_you_message || DEFAULT_THANKS;
  const [statusLabel, statusColor] = STATUS_MAP[coupon.status] || [coupon.status, 'slate'];
  const isActive = coupon.status === 'issued';

  root.innerHTML = `
    <div class="text-center mb-6">
      <div class="inline-flex w-16 h-16 rounded-full bg-green-100 items-center justify-center mb-3 text-2xl">✅</div>
      <h1 class="text-2xl font-bold">感謝您的回饋！</h1>
      <p class="text-sm text-slate-600 mt-3 pre leading-relaxed">${esc(thanks)}</p>
    </div>

    <div class="bg-white border-2 border-dashed border-brand-400 rounded-2xl p-6 shadow-lg">
      <div class="text-center">
        ${survey?.location_name ? `<div class="text-base font-bold text-slate-800 mb-1">📍 ${esc(survey.location_name)}</div>` : ''}
        ${survey?.title ? `<div class="text-xs text-slate-500 mb-3">${esc(survey.title)}</div>` : ''}
        <div class="inline-block bg-brand-600 text-white px-3 py-1 rounded text-xs font-bold mb-3">
          ${esc(survey?.coupon_title || '贈品兌換券')}
        </div>
        <div class="text-xs text-slate-500">${esc(survey?.coupon_subtitle || '感謝您完成滿意度調查')}</div>

        <div class="relative my-6 inline-block p-3 bg-white rounded-lg border-2 ${isActive ? 'border-slate-900' : 'border-slate-300 opacity-50'}">
          <div id="qrBox"></div>
          ${!isActive ? `<div class="absolute inset-0 flex items-center justify-center"><div class="bg-red-500 text-white text-2xl font-bold px-6 py-2 -rotate-12 rounded">${esc(statusLabel)}</div></div>` : ''}
        </div>

        <div class="text-lg font-mono font-bold text-brand-700 tracking-wider">${esc(coupon.coupon_code)}</div>
        <div class="mt-4 text-left text-sm space-y-2 border-t pt-4">
          <div class="flex justify-between"><span class="text-slate-500">產生時間</span><span>${esc(fmtTpe(coupon.issued_at))}</span></div>
          <div class="flex justify-between"><span class="text-slate-500">有效期限</span><span>${esc(fmtTpe(coupon.expires_at))}</span></div>
          ${survey?.redemption_location ? `<div class="flex justify-between"><span class="text-slate-500">兌換地點</span><span class="text-right">${esc(survey.redemption_location)}</span></div>` : ''}
          <div class="flex justify-between"><span class="text-slate-500">兌換狀態</span><span class="font-bold text-${statusColor}-600">${esc(statusLabel)}</span></div>
          ${coupon.redeemed_at ? `<div class="flex justify-between"><span class="text-slate-500">核銷時間</span><span>${esc(fmtTpe(coupon.redeemed_at))}</span></div>` : ''}
        </div>
      </div>
    </div>

    <div class="mt-5 bg-amber-50 border border-amber-200 rounded-lg p-4 text-sm text-amber-800">
      <p class="font-bold mb-2">兌換注意事項</p>
      <ol class="list-decimal list-inside space-y-1 text-amber-700 leading-relaxed">
        ${TERMS.map(t => `<li>${esc(t)}</li>`).join('')}
      </ol>
    </div>

    ${nextActionHTML(survey)}

    <a href="my-coupons.html" class="mt-5 block w-full text-center bg-white border-2 border-brand-600 text-brand-700 font-bold py-3 rounded-xl">查看我的所有兌換券 →</a>
    <a href="index.html" class="mt-3 block text-center text-sm text-slate-500">返回首頁</a>`;

  const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(coupon.qr_code_value || coupon.coupon_code);
  document.getElementById('qrBox').innerHTML = '<img src="' + qrUrl + '" alt="QR Code" width="240" height="240">';
}
</script>
</body>
</html>
