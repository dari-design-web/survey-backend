<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>兌換券</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="config.js"></script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{font-family:'Noto Sans TC',sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800">
<main class="max-w-md mx-auto px-5 py-8 min-h-screen" id="root">
  <div class="text-center py-12 text-slate-400">載入中…</div>
</main>
<script>
const code = new URLSearchParams(location.search).get('code');
const root = document.getElementById('root');
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[c]))}

(async () => {
  if (!code) { root.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 rounded-lg p-4">缺少 ?code= 參數</div>'; return; }
  try {
    const { coupon, survey } = await API.get('/api/public/coupons/' + encodeURIComponent(code));
    const sm = {issued:['未兌換','green'], redeemed:['已兌換','slate'], expired:['已逾期','red'],
                voided:['已取消','red'], invalid:['無效','red']};
    const [lab, col] = sm[coupon.status] || [coupon.status, 'slate'];
    const isActive = coupon.status === 'issued';
    root.innerHTML = `
      <div class="bg-white border-2 border-dashed border-brand-400 rounded-2xl p-6 shadow-lg">
        <div class="text-center">
          <div class="inline-block bg-brand-600 text-white px-3 py-1 rounded text-xs font-bold mb-3">${esc(survey?.coupon_title || '贈品兌換券')}</div>
          <div class="text-xs text-slate-500">${esc(survey?.coupon_subtitle || '')}</div>
          <div class="relative my-6 inline-block p-3 bg-white rounded-lg border-2 ${isActive ? 'border-slate-900' : 'border-slate-300 opacity-50'}">
            <div id="qrBox"></div>
            ${!isActive ? `<div class="absolute inset-0 flex items-center justify-center"><div class="bg-red-500 text-white text-2xl font-bold px-6 py-2 -rotate-12 rounded">${esc(lab)}</div></div>` : ''}
          </div>
          <div class="text-lg font-mono font-bold text-brand-700 tracking-wider">${esc(coupon.coupon_code)}</div>
          <div class="mt-4 text-left text-sm space-y-2 border-t pt-4">
            <div class="flex justify-between"><span class="text-slate-500">產生時間</span><span>${esc(coupon.issued_at?.slice(0,19).replace('T',' '))}</span></div>
            <div class="flex justify-between"><span class="text-slate-500">有效期限</span><span>${esc(coupon.expires_at?.slice(0,19).replace('T',' '))}</span></div>
            ${survey?.redemption_location ? `<div class="flex justify-between"><span class="text-slate-500">兌換地點</span><span>${esc(survey.redemption_location)}</span></div>` : ''}
            <div class="flex justify-between"><span class="text-slate-500">狀態</span><span class="font-bold text-${col}-600">${esc(lab)}</span></div>
            ${coupon.redeemed_at ? `<div class="flex justify-between"><span class="text-slate-500">核銷時間</span><span>${esc(coupon.redeemed_at.slice(0,19).replace('T',' '))}</span></div>` : ''}
          </div>
        </div>
      </div>
      <a href="index.html" class="mt-6 block text-center text-sm text-slate-500">返回首頁</a>`;
    const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(coupon.qr_code_value || coupon.coupon_code);
    document.getElementById('qrBox').innerHTML = '<img src="' + qrUrl + '" alt="QR Code" width="240" height="240">';
  } catch (e) {
    root.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-xl p-6 text-center"><h1 class="text-xl font-bold text-red-700">查無此兌換券</h1><p class="text-sm text-red-600 mt-2">${esc(e.message)}</p></div><a href="index.html" class="mt-6 block text-center text-sm text-slate-500">返回首頁</a>`;
  }
})();
</script>
</body>
</html>
